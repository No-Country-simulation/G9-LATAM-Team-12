spring.application.name=backend
#spring.profiles.active=mock
spring.profiles.active=http
energiai.tarifa-referencia-kwh=0.75
spring.jackson.property-naming-strategy=SNAKE_CASE
springdoc.swagger-ui.path=/swagger
modelo.api.url=http://localhost:8000/predict

# --- H2 (temporal, se reemplaza por MySQL HeatWave mas adelante) ---
spring.datasource.url=jdbc:h2:mem:energiai;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- JWT ---
jwt.secret=${JWT_SECRET:cambiar-este-secreto-en-produccion-min-32-chars}
jwt.expiration-ms=86400000