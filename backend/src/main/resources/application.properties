spring.application.name=backend
#spring.profiles.active=mock
spring.profiles.active=http
energiai.tarifa-referencia-kwh=0.75
spring.jackson.property-naming-strategy=SNAKE_CASE
springdoc.swagger-ui.path=/swagger
modelo.api.url=http://localhost:8000/predict

# --- MySQL HeatWave ---
spring.datasource.url=jdbc:mysql://${DB_HOST:10.0.0.140}:${DB_PORT:3306}/${DB_NAME:energiai}?useSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- JWT ---
jwt.secret=${JWT_SECRET:cambiar-este-secreto-en-produccion-min-32-chars}
jwt.expiration-ms=86400000