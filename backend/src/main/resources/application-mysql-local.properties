spring.datasource.url=jdbc:mysql://localhost:3306/energiai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:energiai_user}
spring.datasource.password=${DB_PASSWORD:energiai_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true


spring.jpa.hibernate.ddl-auto=none


spring.flyway.enabled=true
spring.flyway.url=jdbc:mysql://localhost:3306/energiai
spring.flyway.user=energiai_user
spring.flyway.password=energiai_pass
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true