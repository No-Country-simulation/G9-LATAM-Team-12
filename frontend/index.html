<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnergiAI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>EnergiAI</h1>
    <p>Análisis de consumo energético</p>

    <form id="form-consumo">
        <label for="consumoKwh">Consumo en kWh</label>
        <input type="number" id="consumoKwh" min="0" step="0.1" required>

        <label>
            <input type="checkbox" id="usoHorarioPico">
            Uso en horario pico
        </label>

        <label for="cantidadEquipos">Cantidad de equipos</label>
        <input type="number" id="cantidadEquipos" min="1" required>

        <label for="tipoInmueble">Tipo de inmueble</label>
        <select id="tipoInmueble" required>
            <option value="">Seleccionar...</option>
            <option value="Casa">Casa</option>
            <option value="Departamento">Departamento</option>
        </select>

        <label for="horasAltoConsumo">Horas de alto consumo</label>
        <input type="number" id="horasAltoConsumo" min="0" max="24" required>

        <button type="submit">Analizar</button>
    </form>

    <div id="resultado"></div>

    <script src="js/app.js"></script>
</body>
</html>
