version: '3.3'

services:
  data-ml-app:
    build:
      context: ./data/Modelo Machine
      dockerfile: Dockerfile
    container_name: data-ml-app
    ports:
      - "8000:8000"
    restart: always

  backend-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-app
    ports:
      - "8080:8080"
    environment:
      - MODELO_API_URL=http://data-ml-app:8000/predict
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/energiai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_FLYWAY_URL=jdbc:mysql://mysql:3306/energiai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    depends_on:
      - data-ml-app
      - mysql
    restart: always

  frontend-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    ports:
      - "80:80"
    depends_on:
      - backend-app
    restart: always

  mysql:
    image: mysql:8.4
    container_name: energiai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: energiai
      MYSQL_USER: energiai_user
      MYSQL_PASSWORD: energiai_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: