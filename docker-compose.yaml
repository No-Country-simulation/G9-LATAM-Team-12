version: '3.3'

services:
  # 1. Servicio del Modelo de Machine Learning (Python / FastAPI)
  data-ml-app:
    build:
      context: ./data/Modelo Machine
      dockerfile: Dockerfile
    container_name: data-ml-app
    ports:
      - "8000:8000"
    restart: always

  backend-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-app
    ports:
      - "8080:8080"
    environment:
      - MODELO_API_URL=http://data-ml-app:8000
    depends_on:
      - data-ml-app
    restart: always